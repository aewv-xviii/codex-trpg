<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151616"><title>밤의 테이블</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/play/style.css"><link rel="stylesheet" href="/play/presentation.css"><link rel="stylesheet" href="/play/vtt.css"><link rel="stylesheet" href="/play/economy.css"><link rel="stylesheet" href="/play/inventory.css"><link rel="stylesheet" href="/play/content-packs.css"><link rel="stylesheet" href="/play/exploration.css"><link rel="stylesheet" href="/play/start.css"><link rel="stylesheet" href="/play/play-layout.css"><link rel="stylesheet" href="/play/world-library.css"><link rel="stylesheet" href="/play/combat-hud.css"><link rel="stylesheet" href="/play/scene-replay.css"></head>
<body>
<div class="app-shell">
<header class="table-header"><button class="brand" id="tables-button" title="테이블 바꾸기"><span class="brand-seal" aria-hidden="true">✧</span>밤의 테이블</button><div class="table-identity"><h1 id="table-title">새로운 이야기</h1><p id="table-subtitle">세션 준비</p></div><div class="header-actions"><span id="connection" role="status">연결 중</span><button id="invite-button">초대</button><button id="settings-button">설정</button></div></header>
<aside class="sidebar"><nav aria-label="주 메뉴" id="navigation"></nav></aside>
<main class="main"><div id="combat-hud"></div><div id="table-canvas" class="table-canvas"></div><div class="map-toolbar" id="map-toolbar"></div><div class="stage-tabs" id="stage-tabs" role="tablist" aria-label="플레이 화면"></div><div id="roster" class="roster"></div><section id="workspace-drawer" class="workspace-drawer" hidden><header class="drawer-head"><span id="drawer-title">패널</span><button class="drawer-close" data-close-drawer aria-label="패널 닫기">×</button></header><div id="main-content" class="main-content"></div></section></main>
<aside class="chat-panel" aria-label="대화와 판정"><section id="portrait-rail" class="portrait-rail" aria-label="상시 초상화" hidden></section><div id="log-tabs" class="log-tabs" role="tablist" aria-label="기록 필터"></div><div id="chat-log" class="chat-log" role="log" aria-label="공동 기록"></div><div id="pending-actions" class="pending-actions"></div><form id="composer" class="composer"><div class="compose-toolbar"><div id="compose-speaker" class="compose-speaker"></div><label class="compose-destination"><span class="sr-only">보낼 곳</span><select id="compose-destination" aria-label="보낼 곳"></select></label></div><label class="expression-picker" id="expression-wrap" hidden>초상화 <select id="expression-select" aria-label="초상화"></select></label><div id="compose-context" class="compose-context" hidden></div><div class="compose-row"><label class="sr-only" for="message">메시지</label><textarea id="message" placeholder="무엇을 하나요?" maxlength="4000" rows="2"></textarea><button class="primary" type="submit" id="send-button">보내기</button></div><div id="compose-help" class="compose-help"></div></form><div class="turn-bar"><button id="gm-status" class="gm-status">GM 대기</button></div></aside>
</div>
<section id="character-panel" hidden></section>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="닫기">×</button></div><div id="modal-body"></div></dialog><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/play/app.js"></script></body></html>
